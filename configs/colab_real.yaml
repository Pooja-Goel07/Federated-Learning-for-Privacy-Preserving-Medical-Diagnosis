# Real-data Colab run — core baselines + federated FedAvg (Tasks 4, 5, 6).
#
# Drives the centralised ceiling, single-site floor and federated global model on a
# patient-aware ~20k-image subset of NIH ChestX-ray14, on a GPU. Defence layers
# (DP, robust aggregation, attacks) are OFF — this is the core comparison.
#
# Used by notebooks/colab_training.ipynb via src.experiments.suite.run_core_suite.
# data.root and partition.manifest_path are set by the notebook (Colab paths).

experiment:
  name: "colab_real"
  seed: 42
  output_dir: "results/colab"        # notebook overrides to a Drive path

data:
  root: "/content/nih"               # notebook sets this to the unzip dir
  image_size: 224                    # standard ChestX-ray14 input
  severity:
    enabled: true
    binning: "tercile"
  subsample:
    enabled: true
    max_images: 20000                # ~20k images, patient-aware, bbox kept first
    keep_bbox: true

partition:
  num_nodes: 3
  scheme: "non_iid"                  # Dirichlet label-skew across the 3 hospitals
  test_frac: 0.2
  manifest_path: "/content/nih/manifest.json"   # shared by all three runs
  non_iid:
    alpha: 0.5

model:
  backbone: "densenet121"
  pretrained: true                  # ImageNet weights (downloaded by torchvision)
  dropout: 0.0
  heads:
    pathology: true
    severity: true

training:
  local_epochs: 3                   # epochs for centralised + single-site baselines
  batch_size: 32
  optimizer: "adam"
  lr: 0.0001
  rounds: 10                        # federated communication rounds
  num_workers: 2
  use_gpu: true
  severity_weight: 1.0
  max_batches: null                 # use all data

federated:
  strategy: "fedavg"                # plain FedAvg (no robust aggregation)
  fraction_fit: 1.0
  heterogeneity_mitigation:
    fedprox_mu: 0.0
    fedbn: false
  robust:
    beta: 0.2
    multi_k: 2

privacy:
  dp:
    enabled: false                  # DP off for the core run

attack:
  enabled: false                    # no Byzantine attack
  byzantine:
    type: "none"
    fraction: 0.0

evaluation:
  metrics: ["auc", "accuracy", "severity_mae", "severity_qwk"]
