<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FedMedGuard — Federated Learning Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0b1020; color:#e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .flow { stroke-dasharray: 4 6; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin:center; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  .card { background:#111830; border:1px solid #1f2a44; border-radius:14px; }
</style>
</head>
<body>
<div id="root" class="min-h-screen"></div>

<script>
// Real, verified results embedded so the dashboard works offline. Source: results/summary.json
// (core run) and results/sweep_results.json (defence runs). Two experiment scales:
//   CORE    : 3 nodes, 224px, ~30k images, 12 rounds  (floor/fed/ceiling comparison)
//   DEFENCE : 6 nodes, 128px, ~12k images, 8 rounds    (DP, robustness, composition)
window.FMG = {
  core:   { single: 0.721, fed: 0.754, central: 0.772,
            curve: [0.486,0.607,0.645,0.694,0.716,0.733,0.735,0.741,0.751,0.749,0.758,0.761,0.754] },
  dp:     { clean: 0.642, "1.0": {auc:0.493, eps:4.5}, "2.0": {auc:0.487, eps:1.4} },
  robust: { clean: 0.642, fedavg:0.500, krum:0.545, median:0.562, trimmed_mean:0.571 },
  comp:   { fedavg_nodp:0.500, fedavg_dp:0.506, median_nodp:0.562, median_dp:0.458 }
};
</script>

<script type="text/babel">
const {useState, useEffect} = React;
const D = window.FMG;
const C = { server:"#3b82c4", hospital:"#4a9d6b", mal:"#b8574f", dp:"#8b6fc4", ink:"#e5e7eb", mut:"#94a3b8" };

function fmt(x){ return (x==null||isNaN(x)) ? "—" : x.toFixed(3); }

// ---- scenario -> which real numbers to show ----
function resolve(s){
  const {strategy, dp, attack} = s;
  if(!attack && !dp && strategy==="fedavg"){
    return {scale:"CORE", headline:D.core.fed, label:"Federated (FedAvg)",
      refs:[["Single-site floor",D.core.single],["Federated",D.core.fed],["Centralised ceiling",D.core.central]],
      note:"Core comparison (3 nodes, 224px, ~30k). Federated beats isolated silos and nears the pooled ceiling.",
      exp:"EXP-003"};
  }
  if(dp && !attack){
    const d = D.dp[dp];
    return {scale:"DEFENCE", headline:d.auc, label:`FedAvg + DP (σ=${dp}, ε≈${d.eps})`,
      refs:[["No DP",D.dp.clean],[`DP σ=1.0 (ε≈4.5)`,D.dp["1.0"].auc],[`DP σ=2.0 (ε≈1.4)`,D.dp["2.0"].auc]],
      note:"Privacy–utility trade-off (6 nodes, 128px, ~12k). Tighter privacy (smaller ε) costs utility.",
      exp:"EXP-004"};
  }
  if(attack && !dp){
    const v = D.robust[strategy] ?? D.robust.fedavg;
    return {scale:"DEFENCE", headline:v, label:`${strategy} under attack`,
      refs:[["Clean (no attack)",D.robust.clean],["FedAvg (attacked)",D.robust.fedavg],
            ["Krum",D.robust.krum],["Median",D.robust.median],["Trimmed mean",D.robust.trimmed_mean]],
      note:"Robustness under model-replacement (2/6 malicious). Plain FedAvg collapses to chance; robust rules hold.",
      exp:"EXP-005"};
  }
  // attack + dp -> composition (measured for fedavg and median)
  const key = (strategy==="median"?"median":"fedavg") + (dp?"_dp":"_nodp");
  const v = D.comp[key];
  const measured = (strategy==="median"||strategy==="fedavg");
  return {scale:"DEFENCE", headline:v, label:`${strategy} + DP, under attack`,
    refs:[["FedAvg no-DP",D.comp.fedavg_nodp],["FedAvg + DP",D.comp.fedavg_dp],
          ["Median no-DP",D.comp.median_nodp],["Median + DP",D.comp.median_dp]],
    note: measured
      ? "Composition (G1): DP costs Median −0.104 AUC but FedAvg ~0 — DP erodes the robust defence. Destructive composition."
      : "Composition measured for FedAvg & Median; showing the median result as the robust reference.",
    exp:"EXP-006"};
}

// ---- animated hospital <-> server network ----
function Network({nodes, malicious, dp, attack, aggregating}){
  const W=560,H=420,cx=W/2,cy=H/2,R=150;
  const pos = Array.from({length:nodes},(_,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/nodes;
    return {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a), mal: malicious.includes(i)};
  });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
      {pos.map((p,i)=>{
        const col = p.mal ? C.mal : C.hospital;
        return <g key={"l"+i}>
          <line x1={p.x} y1={p.y} x2={cx} y2={cy} stroke={col} strokeOpacity="0.35" strokeWidth="2"/>
          <line x1={p.x} y1={p.y} x2={cx} y2={cy} stroke={col} strokeWidth="2.4" className="flow"/>
          {dp && !p.mal && <circle cx={(p.x+cx)/2} cy={(p.y+cy)/2} r="9" fill={C.dp}
             stroke="#1f2a44" strokeWidth="1.5"><title>Differential-privacy layer (noise + clipping)</title></circle>}
          {dp && !p.mal && <text x={(p.x+cx)/2} y={(p.y+cy)/2+3} textAnchor="middle" fontSize="9" fill="#fff">DP</text>}
        </g>;
      })}
      {/* server */}
      <circle cx={cx} cy={cy} r="34" fill={C.server} className={aggregating?"pulse":""}/>
      <circle cx={cx} cy={cy} r="34" fill="none" stroke="#9fc3e8" strokeWidth="2"/>
      <text x={cx} y={cy-2} textAnchor="middle" fontSize="11" fontWeight="700" fill="#fff">Centre</text>
      <text x={cx} y={cy+12} textAnchor="middle" fontSize="9" fill="#dbeafe">aggregate</text>
      {/* hospitals */}
      {pos.map((p,i)=>(
        <g key={"n"+i}>
          <circle cx={p.x} cy={p.y} r="24" fill={p.mal?C.mal:C.hospital}/>
          <circle cx={p.x} cy={p.y} r="24" fill="none" stroke="#0b1020" strokeWidth="2"/>
          <text x={p.x} y={p.y-1} textAnchor="middle" fontSize="13">{p.mal?"☠":"🏥"}</text>
          <text x={p.x} y={p.y+13} textAnchor="middle" fontSize="8" fill="#0b1020" fontWeight="700">H{i+1}</text>
        </g>
      ))}
    </svg>
  );
}

function Bar({label, value, max, color}){
  const pct = Math.max(2, Math.min(100, (value/max)*100));
  return (
    <div className="mb-2">
      <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">{label}</span>
        <span className="font-semibold" style={{color}}>{fmt(value)}</span></div>
      <div className="h-2.5 rounded bg-slate-800"><div className="h-2.5 rounded" style={{width:pct+"%",background:color}}/></div>
    </div>
  );
}

function Toggle({label, on, onClick, color}){
  return <button onClick={onClick}
    className={"px-3 py-1.5 rounded-lg text-sm font-medium border transition "+
      (on?"text-white":"text-slate-300")}
    style={{background:on?color:"#0b1020", borderColor:on?color:"#1f2a44"}}>{label}</button>;
}

function App(){
  const [strategy,setStrategy]=useState("fedavg");
  const [dp,setDp]=useState(null);           // null | "1.0" | "2.0"
  const [attack,setAttack]=useState(false);
  const [agg,setAgg]=useState(false);
  useEffect(()=>{ const t=setInterval(()=>setAgg(a=>!a),1600); return ()=>clearInterval(t); },[]);

  const nodes = (attack||dp||strategy!=="fedavg") ? 6 : 3;     // defence scale uses 6
  const malicious = attack ? (nodes===6?[1,4]:[1]) : [];
  const S = {strategy, dp, attack};
  const R = resolve(S);
  const maxRef = Math.max(...R.refs.map(r=>r[1]), R.headline, 0.8);

  return (
    <div className="max-w-6xl mx-auto px-5 py-6">
      <div className="flex items-baseline justify-between flex-wrap gap-2">
        <h1 className="text-2xl font-bold text-white">FedMedGuard — Federated Learning for Privacy-Preserving Medical Diagnosis</h1>
        <span className="text-xs px-2 py-1 rounded card text-slate-300">Scale: <b className="text-white">{R.scale}</b> · {R.exp}</span>
      </div>
      <p className="text-slate-400 text-sm mt-1">Hospitals train locally and send only model weights to the centre node, which aggregates them. Toggle the scenarios below to see the real measured results for each.</p>

      <div className="grid md:grid-cols-5 gap-5 mt-5">
        {/* network + controls */}
        <div className="md:col-span-3 card p-4">
          <Network nodes={nodes} malicious={malicious} dp={!!dp} attack={attack} aggregating={agg}/>
          <div className="flex flex-wrap gap-2 mt-3 items-center">
            <span className="text-xs text-slate-400 w-full">Aggregation rule</span>
            {["fedavg","krum","median","trimmed_mean"].map(k=>
              <Toggle key={k} label={k==="trimmed_mean"?"Trimmed":k[0].toUpperCase()+k.slice(1)}
                on={strategy===k} color={strategy===k?C.hospital:C.hospital} onClick={()=>setStrategy(k)}/>) }
          </div>
          <div className="flex flex-wrap gap-2 mt-3 items-center">
            <span className="text-xs text-slate-400 w-full">Differential privacy</span>
            <Toggle label="Off" on={!dp} color={C.dp} onClick={()=>setDp(null)}/>
            <Toggle label="σ=1.0 (ε≈4.5)" on={dp==="1.0"} color={C.dp} onClick={()=>setDp("1.0")}/>
            <Toggle label="σ=2.0 (ε≈1.4)" on={dp==="2.0"} color={C.dp} onClick={()=>setDp("2.0")}/>
          </div>
          <div className="flex flex-wrap gap-2 mt-3 items-center">
            <span className="text-xs text-slate-400 w-full">Byzantine attack</span>
            <Toggle label="None" on={!attack} color={C.mal} onClick={()=>setAttack(false)}/>
            <Toggle label="Model-replacement (2/6 malicious)" on={attack} color={C.mal} onClick={()=>setAttack(true)}/>
          </div>
          <div className="flex gap-4 mt-4 text-xs text-slate-400">
            <span>🏥 honest hospital</span><span style={{color:C.mal}}>☠ malicious</span>
            <span style={{color:C.dp}}>● DP layer</span><span style={{color:C.server}}>● centre</span>
          </div>
        </div>

        {/* results */}
        <div className="md:col-span-2 card p-4">
          <div className="text-xs text-slate-400">Global model — mean ROC-AUC</div>
          <div className="text-4xl font-extrabold text-white mt-1">{fmt(R.headline)}</div>
          <div className="text-sm mt-1" style={{color:C.hospital}}>{R.label}</div>
          <div className="mt-4">
            {R.refs.map((r,i)=>(
              <Bar key={i} label={r[0]} value={r[1]} max={maxRef}
                color={ r[0].includes("ceiling")||r[0].includes("No DP")||r[0].includes("Clean")?C.server
                      : r[0].includes("FedAvg (attack")||r[0].includes("floor")?C.mut
                      : r[0].includes("DP")?C.dp : C.hospital }/>
            ))}
          </div>
          <div className="text-xs text-slate-400 mt-4 leading-relaxed border-t border-slate-800 pt-3">{R.note}</div>
        </div>
      </div>

      {/* scenario legend */}
      <div className="card p-4 mt-5">
        <div className="text-sm font-semibold text-white mb-2">What each scenario shows</div>
        <div className="grid md:grid-cols-4 gap-3 text-xs text-slate-300">
          <div><b className="text-white">Baseline (EXP-003)</b><br/>FedAvg, no DP, no attack. Federated 0.754 beats single-site 0.721, nears pooled 0.772.</div>
          <div><b style={{color:C.dp}}>DP on (EXP-004)</b><br/>Privacy noise lowers utility: 0.642 → 0.49. Smaller ε = more privacy, less accuracy.</div>
          <div><b style={{color:C.mal}}>Attack on (EXP-005)</b><br/>2/6 malicious. FedAvg collapses to 0.50; robust rules (median 0.56, trimmed 0.57) survive.</div>
          <div><b className="text-white">DP + Attack (EXP-006)</b><br/>Composition G1: DP costs Median −0.104 but FedAvg ~0 — the two defences fight each other.</div>
        </div>
      </div>

      <p className="text-xs text-slate-500 mt-4">All numbers are the project's real measured results. CORE scenarios use 3 nodes / 224px / ~30k images; DEFENCE scenarios (DP, attack, robust rules) use 6 nodes / 128px / ~12k images — stated so the two scales are never confused.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
